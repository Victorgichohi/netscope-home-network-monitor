[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "home-net-monitor"
version = "0.5.0"
description = "Privacy-conscious home network monitoring dashboard and router portal"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic-settings>=2.5,<3",
  "apscheduler>=3.10,<4",
  "scapy>=2.6,<3",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.12,<1",
  "paramiko>=3.5,<5",
  "httpx>=0.27,<1",
  "manuf>=1.1.5,<2",
]

[project.scripts]
netscope = "app.desktop:main"

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
